[project]
name = "fdm-cad-workbench"
version = "0.1.0"
description = "Repeatable engineering CAD, print-mesh exports, and geometric verification"
requires-python = ">=3.13,<3.14"
dependencies = [
  "build123d==0.11.1",
  "trimesh==5.1.0",
  "manifold3d==3.5.3",
  "networkx>=3.4,<4",
  "lxml>=5,<7",
  "matplotlib>=3.10,<4",
  "pillow>=11,<13",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdm_cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
